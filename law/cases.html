<script>
(function checkAuth() {
    const isLoggedIn = sessionStorage.getItem('isLoggedIn');
    const username = sessionStorage.getItem('username');
    if (!isLoggedIn || isLoggedIn !== 'true') { window.location.href = 'lawfirm.html'; return false; }
    window.currentUser = username;
    return true;
})();

<div id="mask" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">

<script>
function updateTime() {
    const now = new Date();
    document.getElementById('currentTime').textContent = '当前时间：' + now.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
updateTime(); setInterval(updateTime, 1000);
function logout() { if (confirm('确定要退出登录吗？')) window.location.href = 'lawfirm.html'; }

(function initUserView() {
    const username = window.currentUser || sessionStorage.getItem('username');
    const userAvatar = document.getElementById('userAvatar');
    const userDisplay = document.getElementById('userDisplayName');
    if (username === 'admin') {
        if (userAvatar) userAvatar.textContent = '律';
        if (userDisplay) userDisplay.textContent = '沈致远 律师';
    } else {
        if (userAvatar) userAvatar.textContent = '助';
        if (userDisplay) userDisplay.textContent = '春梅 (你)';
    }
})();

var CASES=[
{n:'MC-2026-0042',r:'遗嘱公证及遗产继承',p:'周素兰（已故）',l:'沈致远',s:'处理中',u:'2026-02-18',

var tbody=document.getElementById('tbody');
function render(){
  var s=document.getElementById('fStatus').value,
      l=document.getElementById('fLawyer').value,
      k=document.getElementById('fKey').value.trim();
  var rows=CASES.filter(function(c){
    return (!s||c.s===s)&&(!l||c.l===l)&&(!k||(c.n+c.p+c.r).indexOf(k)>-1);
  });
  tbody.innerHTML=rows.map(function(c){
    return '<tr class="hover:bg-gray-50 transition">'
      +'<td class="px-4 py-3 text-gray-500">'+c.n+'</td>'
      +'<td class="px-4 py-3">'+c.r+'</td>'
      +'<td class="px-4 py-3">'+c.p+'</td>'
      +'<td class="px-4 py-3">'+c.l+'</td>'
      +'<td class="px-4 py-3">'+(c.s==='处理中'?'<span class="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full text-xs">处理中</span>':'<span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full text-xs">已结案</span>')+'</td>'
      +'<td class="px-4 py-3 text-gray-500">'+c.u+'</td>'
      +'<td class="px-4 py-3 text-center"><button data-n="'+c.n+'" class="view text-purple-600 hover:underline font-medium">查看 →</button></td></tr>';
  }).join('');
  document.getElementById('count').textContent='显示 '+rows.length+' 条，共 '+CASES.length+' 条记录';
  Array.prototype.forEach.call(document.querySelectorAll('.view'),function(b){
    b.onclick=function(){openDetail(b.getAttribute('data-n'));};
  });
}
function openDetail(n){
  var c=CASES.filter(function(x){return x.n===n;})[0];
  var h='<h2 class="text-lg font-bold mb-1 text-gray-800">'+c.n+' · '+c.r+'</h2>'
    +'<div class="text-xs text-gray-500 mb-4">当事人：'+c.p+' 承办：'+c.l+' 状态：'+c.s+' 最后更新：'+c.u+'</div>'
    +'<p class="text-sm leading-6 text-gray-700 mb-5">'+c.d+'</p>';
  h+='<h3 class="text-xs font-bold text-gray-500 uppercase mb-2">案件附件</h3>';
  if(c.att){
    h+='<ul class="space-y-2 mb-5">';
    c.att.forEach(function(a){h+='<li class="text-sm flex items-center"><span class="mr-2">📄</span><a href="'+a.f+'" target="_blank" class="text-purple-600 hover:underline">'+a.t+'</a></li>';});
    h+='</ul>';
  }else{
    h+='<div class="text-sm text-gray-400 mb-5 flex items-center"><span class="mr-2">📁</span>纸质卷宗已归档（未数字化），如需查阅请到档案室调取。</div>';
  }
  if(c.note){h+='<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-xs leading-5 text-gray-700 mb-5">'+c.note+'</div>';}
 // 沈律师视角的深度调查笔记
if(c.n==='MC-2026-0042' && window.currentUser === 'admin'){
    h += '<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-sm leading-6 text-gray-800 mb-5">'
      + '<h4 class="font-bold text-red-800 mb-2">🕵️ 沈致远的深度调查笔记</h4>'
      + '<p class="mb-2"><strong>关于护工许晴：</strong>她只是个红鲱鱼。案发时她因车祸在市二院骨科住院，有完整的不在场证明。老太太把她当成死去的五女儿“小梅”，对她极其信任。遗嘱里给她留了医疗援助金，这引起了子女们的嫉妒，但这绝不是杀机。</p>'
      + '<p class="mb-2"><strong>关于零件编号：</strong>周素兰在机械厂干了一辈子质检。她日记里反复圈出的 Q-001 和 M-042，绝对不是零件。Q...M... 周启明 (Qi Ming)？如果真的是他，那这个家庭的秘密比我想象的还要不堪。</p>'
      + '<p><strong>下一步行动：</strong>我必须去一趟二院，查周启明2月16日下午的排班和门禁记录。如果我没能回来，春梅，靠你了。</p>'
      + '</div>';
}
  document.getElementById('detail').innerHTML=h;
  var m=document.getElementById('mask');m.classList.remove('hidden');m.classList.add('flex');
}
document.getElementById('close').onclick=function(){var m=document.getElementById('mask');m.classList.add('hidden');m.classList.remove('flex');};
document.getElementById('mask').onclick=function(e){if(e.target===this)document.getElementById('close').onclick();};
['fStatus','fLawyer','fKey'].forEach(function(id){document.getElementById(id).oninput=render;});

var q=new URLSearchParams(location.search);
if(q.get('lawyer')==='shen'){document.getElementById('fLawyer').value='沈致远';}
render();
</script>
