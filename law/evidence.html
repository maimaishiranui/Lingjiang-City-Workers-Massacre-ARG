<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MC-2026-0042｜证据复核单</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#eef1f5}</style></head>
<body class="min-h-screen text-slate-800"><header class="bg-slate-800 text-white"><div class="max-w-4xl mx-auto px-5 py-4 flex justify-between"><div><h1 class="font-semibold">明诚律师事务所 · 案件复核</h1><p class="text-xs text-slate-300">MC-2026-0042 周素兰遗产继承案</p></div><a class="text-sm text-slate-200 hover:underline" href="dashboard.html">返回工作台</a></div></header>
<main class="max-w-4xl mx-auto p-5 md:p-8"><section class="bg-white border border-slate-200 shadow-sm p-6"><p class="text-xs tracking-wider text-slate-500">复核意见草案</p><h2 class="mt-1 text-xl font-semibold">是否建议对“意外死亡”重新侦办？</h2><p class="mt-2 text-sm leading-6 text-slate-600">请选择每一类中最能支持复核的材料。这里提交的是调查意见，不是对任何人的最终定罪。</p><div class="mt-6 space-y-5 text-sm">
<label class="block"><span class="font-semibold">动机</span><select class="block mt-2 w-full border border-slate-300 p-2" data-proof="motive"><option value="">请选择</option><option value="wrong">周卫东签收礼盒</option><option value="right">周素兰以编号记录 Q.M. 与药盒，并刻意隐瞒敏感内容</option></select></label>
<label class="block"><span class="font-semibold">机会</span><select class="block mt-2 w-full border border-slate-300 p-2" data-proof="opportunity"><option value="">请选择</option><option value="wrong">周启明在医院任职</option><option value="right">门禁、社区影像与停车记录共同显示他有无法解释的离岗窗口</option></select></label>
<label class="block"><span class="font-semibold">过敏源进入路径</span><select class="block mt-2 w-full border border-slate-300 p-2" data-proof="means"><option value="">请选择</option><option value="wrong">许晴曾照料周素兰</option><option value="right">周卫东代收礼盒，但内容来自家属群确认的清单</option></select></label>
<label class="block"><span class="font-semibold">案后异常行为</span><select class="block mt-2 w-full border border-slate-300 p-2" data-proof="after"><option value="">请选择</option><option value="wrong">家属要求尽快办追思会</option><option value="right">周启明是追思会前唯一登记的单独接触骨灰盒者</option></select></label>
</div><button id="submit" class="mt-7 bg-slate-800 hover:bg-slate-950 text-white px-5 py-2.5 text-sm">提交复核意见</button><p id="result" class="mt-4 text-sm leading-7"></p></section></main>
<script>document.getElementById('submit').addEventListener('click',()=>{const values=[...document.querySelectorAll('[data-proof]')].map(x=>x.value);const result=document.getElementById('result');if(values.length===4&&values.every(x=>x==='right')){result.className='mt-4 text-sm leading-7 text-green-700';result.innerHTML='<strong>复核意见已提交。</strong> 现有材料足以支持重新核验周启明的陈述与相关证据。系统已生成“建议重新侦办”草案。<br><span class="text-slate-600">沈律师最后留下的那句“灰不能进汤”，现在不再像病中的胡话，而是一条未能及时说完的警告。</span>';}else{result.className='mt-4 text-sm leading-7 text-red-700';result.textContent='证据链尚不严谨。请避免把“可疑”直接写成“已证实”，并分别覆盖动机、机会、路径和案后行为。';}});</script></body></html>
