<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MC-2026-0042｜卷宗证据夹</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#eef1f5}.card{border-left:4px solid #cbd5e1}.card.ready{border-left-color:#2563eb}</style></head><body class="min-h-screen text-slate-800"><header class="bg-slate-800 text-white"><div class="max-w-5xl mx-auto px-5 py-4 flex justify-between"><div><h1 class="font-semibold">明诚律师事务所 · 卷宗证据夹</h1><p class="text-xs text-slate-300">MC-2026-0042　资料阅读不等于证据成立</p></div><a href="dashboard.html" class="text-sm hover:underline">返回工作台</a></div></header><main class="max-w-5xl mx-auto p-5 md:p-8"><section class="bg-white border border-slate-200 shadow-sm p-6"><p class="text-xs tracking-wider text-slate-500">证据来源</p><h2 class="mt-1 text-xl font-semibold">已调阅资料</h2><p class="mt-2 text-sm leading-6 text-slate-600">以下仅表示你已读到资料。要将它们写入正式意见，仍需在下方从相似说法中选择最符合原始记录的结论。</p><div id="sources" class="mt-5 grid md:grid-cols-2 gap-4"></div><div id="hint" class="mt-5 border-t pt-4 text-sm"></div></section><section id="analysis" class="hidden mt-6 bg-white border border-slate-200 shadow-sm p-6"><p class="text-xs tracking-wider text-slate-500">证据分析</p><h2 class="mt-1 text-xl font-semibold">选择可以写入复核意见的四项摘要</h2><p class="mt-2 text-sm leading-6 text-slate-600">每一组都含有看似合理的干扰项。请回忆门户原始记录的措辞，而不是选择最激烈的说法。</p><div class="mt-5 space-y-5 text-sm"><label class="block">死亡事实<select data-p="death" class="mt-2 block w-full border p-2"><option value="">请选择</option><option value="w">周素兰死于过敏，因此周启明已被证明谋杀</option><option value="w">周素兰只因年迈而自然离世</option><option value="r">既往严重过敏史与院外死亡登记应被重新核验，不能直接等同于意外</option></select></label><label class="block">日记与动机<select data-p="diary" class="mt-2 block w-full border p-2"><option value="">请选择</option><option value="w">Q.M. 必然是所有家庭秘密的唯一当事人</option><option value="w">周素兰只是因病产生了无意义的幻觉</option><option value="r">周素兰害怕 Q.M. 接近药盒，并向小梅倾诉一件不敢写完的事</option></select></label><label class="block">礼盒与来访<select data-p="community" class="mt-2 block w-full border p-2"><option value="">请选择</option><option value="w">周卫东签收礼盒，所以他是唯一责任人</option><option value="w">周启明未携带礼盒，因此与礼盒毫无关系</option><option value="r">礼盒内容来自家属群清单；周启明另有独自进入 402 的记录</option></select></label><label class="block">追思会资料<select data-p="funeral" class="mt-2 block w-full border p-2"><option value="">请选择</option><option value="w">白色痕迹已经能说明死亡原因</option><option value="w">家属希望安静办事，因此无需再调查</option><option value="r">周启明单独接触盒体、寻找旧录音笔及异常痕迹均应进一步核验</option></select></label></div><button id="submit" class="mt-6 bg-slate-800 text-white px-5 py-2.5 text-sm">生成复核意见草案</button><p id="result" class="mt-4 text-sm leading-7"></p></section></main><script>const f={death:sessionStorage.getItem('deathSaved')==='true',diary:sessionStorage.getItem('diaryDecoded')==='true',community:sessionStorage.getItem('communityReviewed')==='true',funeral:sessionStorage.getItem('funeralReviewed')==='true'};const data=[['death','医院死亡登记','既往过敏史与院外死亡登记'],['diary','旧质检本与零件目录','Q.M.、药盒、小梅与未写完的秘密'],['community','社区代收与来访记录','礼盒清单、代收人和 402 来访影像'],['funeral','殡仪馆交接资料','委托领取、盒沿异常和工作便条']];document.getElementById('sources').innerHTML=data.map(([k,t,d])=>`<div class="card ${f[k]?'ready':''} bg-slate-50 p-4"><p class="text-xs ${f[k]?'text-blue-700':'text-slate-400'}">${f[k]?'已调阅，待分析':'尚未调阅'}</p><h3 class="mt-1 font-semibold">${t}</h3><p class="mt-2 text-sm text-slate-600">${f[k]?d:'请按律所协查顺序调阅该来源。'}</p></div>`).join('');const h=document.getElementById('hint');if(!f.death)h.innerHTML='先完成医院死亡登记的调阅。<a class="ml-2 text-blue-700 underline" href="external.html">打开协查通道</a>';else if(!f.diary)h.innerHTML='死亡登记只能说明发生了什么；下一步调阅工厂旧档案，理解周素兰为何害怕。<a class="ml-2 text-blue-700 underline" href="external.html">继续协查</a>';else if(!f.community)h.innerHTML='日记留下疑点后，才有理由核对礼盒与来访路径。<a class="ml-2 text-blue-700 underline" href="external.html">继续协查</a>';else if(!f.funeral)h.innerHTML='最后调阅追思会交接资料，核对案后异常行为。<a class="ml-2 text-blue-700 underline" href="external.html">继续协查</a>';else{h.innerHTML='四组来源已调阅。请从下列候选摘要中选择能写入复核意见的内容。';document.getElementById('analysis').classList.remove('hidden')}document.getElementById('submit')?.addEventListener('click',()=>{const v=[...document.querySelectorAll('[data-p]')].map(x=>x.value);const r=document.getElementById('result');if(v.length===4&&v.every(x=>x==='r')){sessionStorage.setItem('reinvestigationDraft','true');r.className='mt-4 text-sm leading-7 text-green-700';r.innerHTML='<strong>复核意见草案已生成。</strong> 现有材料支持重新核验死亡过程、周启明的陈述及案后行为；它没有替任何人定罪。<br><a href="dashboard.html" class="underline font-semibold">返回工作台查看草案 →</a>'}else{r.className='mt-4 text-sm leading-7 text-red-700';r.textContent='至少一项摘要超出了材料能证明的范围，或忽略了关键条件。请回到相应门户重新核对原始记录。'}});</script></body></html>
