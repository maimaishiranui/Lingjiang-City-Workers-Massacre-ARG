<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>患者信息查询 - 临江市第二医院</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 text-sm">

<div class="bg-sky-900 text-white">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-white text-sky-900 font-bold flex items-center justify-center">✚</div>
      <div>
        <div class="font-semibold">临江市第二医院</div>
        <div class="text-xs text-sky-200">患者信息查询系统 · 权限级别：内部授权</div>
      </div>
    </div>
    <a href="hospital.html" class="text-xs text-sky-200 hover:text-white">← 返回医院主页</a>
  </div>
  <nav class="max-w-5xl mx-auto px-4 flex gap-1 text-sm pb-2">
    <a href="hospital.html" class="px-3 py-1.5 rounded hover:bg-sky-800">首页</a>
    <a href="about.html" class="px-3 py-1.5 rounded hover:bg-sky-800">医院概况</a>
    <a href="departments.html" class="px-3 py-1.5 rounded hover:bg-sky-800">科室导航</a>
    <a href="experts.html" class="px-3 py-1.5 rounded hover:bg-sky-800">专家团队</a>
  </nav>
</div>

<main class="max-w-5xl mx-auto px-4 py-6 space-y-4">
  <div class="bg-white rounded border border-slate-200 p-4">
    <div class="flex gap-2 mb-4">
      <button id="tabCur" class="px-3 py-1.5 rounded bg-sky-800 text-white">在院及留观患者</button>
      <button id="tabArc" class="px-3 py-1.5 rounded bg-slate-100 text-slate-600 hover:bg-slate-200">出院及死亡登记档案</button>
    </div>
    <div class="flex flex-wrap gap-3 items-center">
      <input id="qName" placeholder="姓名" class="border border-slate-300 rounded px-2 py-1.5 w-32">
      <input id="qId" placeholder="住院号" class="border border-slate-300 rounded px-2 py-1.5 w-44">
      <select id="qDept" class="border border-slate-300 rounded px-2 py-1.5">
        <option value="">按科室浏览（全部）</option>
        <option>骨科</option><option>内科</option><option>老年病科</option>
        <option>心血管内科</option><option>神经内科</option><option>妇产科</option>
      </select>
      <button id="search" class="bg-sky-800 text-white rounded px-4 py-1.5 hover:bg-sky-700">查询</button>
      <button id="reset" class="border border-slate-300 rounded px-3 py-1.5 hover:bg-slate-50">重置</button>
    </div>
    <p class="text-xs text-slate-400 mt-2">⚠️ 查询需输入姓名或住院号，或选择科室浏览。信息仅供内部医疗参考，查询行为将留痕。</p>
  </div>

  <div class="bg-white rounded border border-slate-200 overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs">
        <tr><th class="text-left px-3 py-2">姓名</th><th class="text-left px-3 py-2">年龄</th><th class="text-left px-3 py-2">科室</th><th class="text-left px-3 py-2">入院日期</th><th class="text-left px-3 py-2">状态</th><th class="text-left px-3 py-2">住院号</th><th class="px-3 py-2">操作</th></tr>
      </thead>
      <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
    </table>
    <div id="empty" class="hidden p-6 text-center text-xs text-slate-400"></div>
  </div>
  <div class="text-xs text-slate-400">记录更新时间：2026-07-24 09:15:32</div>
</main>

<div id="mask" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg max-w-xl w-full p-6 relative">
    <button id="close" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 text-xl">✕</button>
    <div id="detail"></div>
  </div>
</div>

<footer class="max-w-5xl mx-auto px-4 py-6 text-xs text-slate-400 border-t border-slate-200 mt-6">
  临江市第二医院 | 内部信息系统<br>© 2026 版权所有 · 未经授权禁止外传
</footer>

<script>
var CUR=[
{name:'许晴',age:25,dept:'骨科',admit:'2026-01-25',status:'治疗中',id:'LJ2026-0125-017',doc:'王建军',note:'因交通事故于 2026-01-25 22:40 急诊入院，多处骨折，拟手术。2 月 16 日至 2 月 18 日在院治疗，无请假或离院记录。交通事故责任调解中，对方当事人姓张（见法务函件）。'},
{name:'张桂芳',age:68,dept:'内科',admit:'2026-06-12',status:'治疗中',id:'LJ2026-0612-089',doc:'李慧敏',note:'慢性病常规住院，病情平稳。'},
{name:'赵德生',age:71,dept:'老年病科',admit:'2026-07-01',status:'留观中',id:'LJ2026-0701-105',doc:'周启明',note:'居家跌倒后留观，家属探视频繁。'},
{name:'陈国栋',age:60,dept:'神经内科',admit:'2026-07-10',status:'留观中',id:'LJ2026-0710-112',doc:'宋雅琴',note:'头晕待查，颅脑 CT 未见异常。'},
{name:'孙秀英',age:29,dept:'妇产科',admit:'2026-06-30',status:'治疗中',id:'LJ2026-0630-076',doc:'何丽娟',note:'产后观察，预计 7 月上旬出院。'}
];
var ARC=[
{name:'周素兰',age:78,dept:'老年病科',admit:'2025-11-02',status:'死亡登记',id:'LJ2025-1102-042',doc:'周启明',discharge:'2025-11-20',note:'出院诊断：阿尔兹海默症早期。住院期间记录严重食物过敏史（过敏原：花生及大豆蛋白类，详见过敏史摘要）。2026-02-18 外因死亡登记（公安通报附卷）。'},
{name:'刘文斌',age:42,dept:'心血管内科',admit:'2026-05-08',status:'已出院',id:'LJ2026-0508-031',doc:'郑国强',discharge:'2026-05-15',note:'冠脉造影后出院，定期复查。'},
{name:'吴敏',age:34,dept:'妇产科',admit:'2026-06-28',status:'已出院',id:'LJ2026-0628-094',doc:'何丽娟',discharge:'2026-07-02',note:'常规检查后出院。'}
];
var mode='cur';
function setTab(m){
  mode=m;
  document.getElementById('tabCur').className=m==='cur'?'px-3 py-1.5 rounded bg-sky-800 text-white':'px-3 py-1.5 rounded bg-slate-100 text-slate-600 hover:bg-slate-200';
  document.getElementById('tabArc').className=m==='arc'?'px-3 py-1.5 rounded bg-sky-800 text-white':'px-3 py-1.5 rounded bg-slate-100 text-slate-600 hover:bg-slate-200';
  render();
}
function render(){
  var data=mode==='cur'?CUR:ARC;
  var n=document.getElementById('qName').value.trim(),
      id=document.getElementById('qId').value.trim(),
      dept=document.getElementById('qDept').value;
  var rows=data.filter(function(r){
    return (!n||r.name.indexOf(n)>-1)&&(!id||r.id.toLowerCase().indexOf(id.toLowerCase())>-1)&&(!dept||r.dept===dept);
  });
  var tbody=document.getElementById('tbody'),empty=document.getElementById('empty');
  if(rows.length===0){
    tbody.innerHTML='';
    empty.classList.remove('hidden');
    empty.innerHTML='未找到匹配记录。'+(mode==='cur'&&n?'当前在院患者中无此人，请尝试「出院及死亡登记档案」。':'请调整查询条件。');
    return;
  }
  empty.classList.add('hidden');
  tbody.innerHTML=rows.map(function(r){
    return '<tr class="hover:bg-slate-50"><td class="px-3 py-2">'+r.name+'</td><td class="px-3 py-2">'+r.age+'</td><td class="px-3 py-2">'+r.dept+'</td><td class="px-3 py-2">'+r.admit+'</td><td class="px-3 py-2">'+r.status+'</td><td class="px-3 py-2 text-slate-500">'+r.id+'</td><td class="px-3 py-2 text-center"><button data-id="'+r.id+'" class="view text-sky-700 hover:underline">详情</button></td></tr>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.view'),function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-id'),all=CUR.concat(ARC);
      var r=all.filter(function(x){return x.id===id;})[0];
      document.getElementById('detail').innerHTML=
        '<h2 class="text-base font-semibold mb-1">'+r.name+' · '+r.age+'岁</h2>'
        +'<div class="text-xs text-slate-500 mb-3">住院号 '+r.id+'　科室 '+r.dept+'　入院 '+r.admit+(r.discharge?'　出院 '+r.discharge:'')+'　状态 '+r.status+'　主治医师 '+r.doc+'</div>'
        +'<p class="text-sm leading-6 text-slate-700 mb-4">'+r.note+'</p>'
        +'<div class="text-xs text-slate-400">📋 此信息仅供内部医疗参考，请勿外泄。</div>';
      var m=document.getElementById('mask');m.classList.remove('hidden');m.classList.add('flex');
    };
  });
}
document.getElementById('tabCur').onclick=function(){setTab('cur');};
document.getElementById('tabArc').onclick=function(){setTab('arc');};
document.getElementById('search').onclick=render;
document.getElementById('reset').onclick=function(){
  document.getElementById('qName').value='';document.getElementById('qId').value='';document.getElementById('qDept').value='';render();
};
document.getElementById('close').onclick=function(){var m=document.getElementById('mask');m.classList.add('hidden');m.classList.remove('flex');};
setTab('cur');
</script>
</body>
</html>
